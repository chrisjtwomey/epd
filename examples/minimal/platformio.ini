; `pio run` builds the release environment alone.
[platformio]
default_envs = release

[env:release]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
	chrisjtwomey/EpdClient @ ^0.20.0
	chrisjtwomey/EpdBoardInkplate @ ^0.20.0
build_unflags = -DARDUINO_ESP32 -DARDUINO_ESP32_DEV
build_flags =
	-Os                            ; smallest code: espressif32 sets no optimisation
	-DHTTPCLIENT_NOSECURE          ; no HTTPS: the panel fetches over HTTP
	-DARDUINO_INKPLATE10           ; or ARDUINO_INKPLATE6, ARDUINO_INKPLATE5V2…
	-DBOARD_HAS_PSRAM
	-DCLIENT_NAME='"my-display"'   ; how this panel introduces itself
	-DCLIENT_VERSION='"v1.0.0"'
	-DLOG_LEVEL=4

; This example against the checkout it is in, for work on epd itself:
; pio run -e dev
[env:dev]
extends = env:release
lib_deps =
	symlink://../../firmware
	symlink://../../firmware/boards/inkplate

; The panel with an SD card: settings from config.yaml on the card.
; pio run -e sd
[env:sd]
extends = env:release
lib_deps =
	${env:release.lib_deps}
	tobozo/YAMLDuino @ ^1.5.0
build_flags =
	${env:release.build_flags}
	-DUSE_SDCARD
	-DHAS_ARDUINOJSON              ; YAMLDuino's ArduinoJson parser, or no link

; The card build against this checkout: pio run -e sd-dev
[env:sd-dev]
extends = env:sd
lib_deps =
	${env:dev.lib_deps}
	tobozo/YAMLDuino @ ^1.5.0
