; Host-only test project for the EpdClient library.
;
; This file exists so the library's own tests can run in isolation
; (`pio test -e native`). Consumers never see it — library.json excludes it
; from the published package. Firmware builds happen in the consuming project,
; which supplies its own platformio.ini, defaults.cpp and IBoard instance.

[platformio]
; No default_envs: every env here is host-only and is invoked via `pio test`.

[native_common]
platform = native
test_framework = unity
test_build_src = yes

[env:native]
; Pure helpers with no hardware or Arduino dependency at all.
extends = native_common
test_filter =
	test_backoff
	test_battery
	test_refresh_header
	test_user_agent
	test_ota_offer
	test_settings_choice
	test_log_format
build_flags = -std=c++11 -Iinclude
build_src_filter = +<battery.cpp> +<refresh_header.cpp> +<backoff.cpp> +<user_agent.cpp>
	+<ota_offer.cpp> +<settings_choice.cpp> +<log_format.cpp>

[env:native_mock]
; Client code paths that depend on IBoard. Uses MockBoard and the stub headers
; in test/stubs/ in place of the ESP32 / Inkplate libraries.
extends = native_common
test_filter = test_mock_board
build_flags =
	-std=c++14
	-Iinclude
	-Itest/stubs
	-DLOG_LEVEL=0
	-DNATIVE
build_src_filter = +<display_utils.cpp> +<sleep_utils.cpp>

[env:native_integration]
; The full run_app() control flow. Compiles app.cpp + the pure helpers; every
; hardware-dependent free function is replaced by a stub in
; test/test_integration/stubs.cpp, and the config symbols by test_defaults.cpp.
extends = native_common
test_filter = test_integration
build_flags =
	-std=c++14
	-Iinclude
	-Itest/stubs
	-Itest/test_integration
	-DLOG_LEVEL=0
	-DNATIVE
build_src_filter = +<app.cpp> +<backoff.cpp> +<user_agent.cpp> +<ota_offer.cpp>
	+<wake.cpp> +<sd_config.cpp>
