; Host-only test project for the EpdClient library.
;
; This file exists so the library's own tests can run in isolation
; (`pio test`). Consumers never see it — library.json excludes it from the
; published package. Firmware builds happen in the consuming project, which
; supplies its own platformio.ini, defaults.cpp and IBoard instance.
;
; The order of a wake is not the kit's, so nor is its test. A project builds
; its own sequence from the steps in wake.h and tests it against the stub
; headers and MockBoard this library ships in test_support/ and include/.

[platformio]
; No default_envs: every env here is host-only and is invoked via `pio test`.

[native_common]
platform = native
test_framework = unity
test_build_src = yes

[env:native]
; Pure helpers with no hardware or Arduino dependency at all.
extends = native_common
test_filter =
	test_backoff
	test_battery
	test_header_value
	test_user_agent
	test_ota_offer
	test_settings_choice
	test_log_format
	test_version_compat
	test_mqtt_topic
	test_wifi_retry
	test_local_time
	test_body_read
	test_log_backlog
build_flags = -std=c++11 -Iinclude
build_src_filter = +<battery.cpp> +<header_value.cpp> +<backoff.cpp> +<user_agent.cpp>
	+<ota_offer.cpp> +<settings_choice.cpp> +<log_format.cpp> +<version_compat.cpp> +<mqtt_topic.cpp>
	+<local_time.cpp> +<body_read.cpp> +<log_backlog.cpp>

[env:native_mock]
; Library code that draws on a board. Uses MockBoard and the stub headers in
; test_support/ in place of the ESP32 / Inkplate libraries.
extends = native_common
test_filter = test_mock_board
build_flags =
	-std=c++14
	-Iinclude
	-Itest_support
	-DLOG_LEVEL=0
	-DNATIVE
build_src_filter = +<epd.cpp> +<sleep_utils.cpp> +<local_time.cpp>

[env:native_settings]
; loadConfig and the board key's store against the Preferences stub in test_support/.
extends = native_common
test_filter = test_settings
build_flags =
	-std=c++14
	-Iinclude
	-Itest_support
	-DNATIVE
build_src_filter = +<settings.cpp> +<settings_choice.cpp> +<board_key.cpp>

[env:native_board_key]
; The board key's signatures, the /pair answer and the step after a refused
; post, against the stand-in mbedTLS in test_support/.
extends = native_common
test_filter = test_board_key
build_flags =
	-std=c++14
	-Iinclude
	-Itest_support
	-DNATIVE
build_src_filter = +<board_key.cpp>

[env:native_io]
; The code that talks to the network, the flash and the broker, against the
; fakes in test/fakes/: scripted HTTP answers, a WiFi link the test joins and
; drops, Update and LittleFS in memory. Every file in src/ compiles here.
extends = native_common
test_filter = test_io_*
test_ignore = test_io_sd
build_flags =
	-std=c++17
	-Iinclude
	-Itest/fakes
	-Itest_support
	-DNATIVE
	-DCLIENT_NAME='"io-test"'
	-DCLIENT_VERSION='"v1.2.0"'
build_src_filter = +<*>

[env:native_io_sd]
; The SD card build: settings from config.yaml, parsed by the real ArduinoJson
; and YAMLDuino, and a page written to the card and drawn from it.
extends = env:native_io
test_filter = test_io_sd
test_ignore =
build_flags =
	${env:native_io.build_flags}
	-DUSE_SDCARD
	-DHAS_ARDUINOJSON
	-DYAML_DISABLE_CJSON
lib_deps =
	bblanchon/ArduinoJson @ ^7.4.0
	tobozo/YAMLDuino @ ^1.5.0
lib_compat_mode = off
