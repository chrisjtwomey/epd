name: PlatformIO CI

on: [push, pull_request]

jobs:
  client-tests:
    name: Client tests (host)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-native
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install platformio==6.2.0

      - name: Run native unit tests
        run: pio test -e native

      - name: Run native_mock tests
        run: pio test -e native_mock

      - name: Run native_settings tests
        run: pio test -e native_settings

      - name: Run native_board_key tests
        run: pio test -e native_board_key

      - name: Run native_io tests
        run: pio test -e native_io

      - name: Run native_io_sd tests
        run: pio test -e native_io_sd

      - name: Run native_inkplate tests
        run: pio test -e native_inkplate

  example-build:
    name: Example project (ESP32)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [minimal, ota]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-esp32
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install platformio==6.2.0

      # The only builds here that see the ESP32 framework. The host tests
      # cannot catch what breaks only there. The dev environment builds
      # against this checkout; the default one takes the last release from
      # the registry.
      - name: Build the example
        run: pio run -e dev

      # The only build that sets USE_SDCARD, with the card's own libraries.
      - name: Build the example with the SD card
        if: matrix.example == 'minimal'
        run: pio run -e sd-dev

  server-tests:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Run pytest
        run: pytest
