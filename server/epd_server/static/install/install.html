<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install firmware</title>
<link rel="stylesheet" href="static/look/look.css">
<style>
  main { max-width: 40rem; margin: 0 auto; padding: 28px 24px 32px; }
  h1 { margin-bottom: 1rem; }
  .note { color: var(--soft); font-size: 0.9rem; }
  .boards { list-style: none; padding: 0; margin: 1.25rem 0; }
  .boards > li { padding: 1rem 0; border-top: 2px solid var(--faint); }
  .boards > li:last-child { border-bottom: 2px solid var(--faint); }
  .board { display: flex; align-items: baseline; gap: 0.75rem; }
  .board strong { font-weight: 500; }
  .version { color: var(--soft); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .board button { margin-left: auto; color: var(--on-ink); background: var(--ink); border-color: var(--ink); }
  .status p { margin: 0.5rem 0 0; }
  .steps { list-style: none; padding: 0; margin: 0.5rem 0 0; color: var(--soft); }
  .steps li.passed { color: var(--ink); }
  .steps li.passed::before { content: "\2713\00a0"; }
  progress { width: 100%; accent-color: var(--ink); }
</style>
</head>
<body>
<main id="install">
<h1>Install firmware</h1>
</main>
<script type="application/json" id="install-config">{{config}}</script>
<script type="module" src="install/install.js"></script>
</body>
</html>
