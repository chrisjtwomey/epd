<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install firmware</title>
<style>
  :root {
    color-scheme: light dark;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: #d2d2d7;
    --accent: #0a66c2;
    --fault: #b3261e;
    --background: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --line: #424245;
      --accent: #4c9be8;
      --fault: #f2817a;
      --background: #1c1c1e;
    }
  }
  body {
    margin: 0;
    background: var(--background);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 36rem; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 1rem; }
  a { color: var(--accent); }
  .note { color: var(--muted); font-size: 0.9rem; }
  .fault { color: var(--fault); }
  .boards { list-style: none; padding: 0; margin: 1.5rem 0; }
  .boards li { padding: 1rem 0; border-top: 1px solid var(--line); }
  .boards li:last-child { border-bottom: 1px solid var(--line); }
  .board { display: flex; align-items: baseline; gap: 0.75rem; }
  .version { color: var(--muted); }
  button {
    margin-left: auto;
    padding: 0.4rem 1.2rem;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #ffffff;
    font: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .status p { margin: 0.5rem 0 0; }
  progress { width: 100%; }
</style>
</head>
<body>
<main id="install">
<h1>Install firmware</h1>
</main>
<script type="application/json" id="install-config">{{config}}</script>
<script type="module" src="install/install.js"></script>
</body>
</html>
